name: Sync FusionVoice to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish backend to FusionVoice Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload MaverickMonoka/FusionVoice ./backend . \
            --repo-type space \
            --commit-message "Sync FusionVoice from GitHub"
